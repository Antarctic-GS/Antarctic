<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antarctic</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/logo/favicon.png" type="image/png">
</head>
<body>
    <div id="sidebar" class="sidebar">

        <!-- Upper Functional Navigation Context (Tabs Control Block) -->
        <div class="sidebar-top">
            <div class="section-label">Tabs</div>
            <div class="tab-item">
                <div class="tab-favicon">N</div>
                <div class="tab-title">New Tab</div>
            </div>
        </div>

        <!-- Master Application and Utility Deck Controls Area -->
        <div class="sidebar-bottom">

            <!-- High Fidelity Grid Dashboard Layout Ecosystem (Updated to 2x2 Grid) -->
            <div class="apps-grid">
                <!-- Grid Items -->
                <div class="grid-item">
                    <div class="icon-box">

                        <img class="sidebar-button-icon" src="assets/svg/games.svg" alt="Games Icon" />
                    </div>
                    <span class="grid-label">Games</span>
                </div>

                <div class="grid-item">
                    <div class="icon-box">
                        <img class="sidebar-button-icon" src="assets/svg/apps.svg" alt="Apps Icon" />
                    </div>
                    <span class="grid-label">Apps</span>
                </div>

                <div class="grid-item">
                    <div class="icon-box">
                        <img class="sidebar-button-icon" ; src="assets/svg/music.svg" alt="Music Icon" />
                    </div>
                    <span class="grid-label">Music</span>
                </div>

                <div class="grid-item">
                    <div class="icon-box">
                        <img class="sidebar-button-icon" src="assets/svg/settings.svg" alt="Settings Icon" />
                    </div>
                    <span class="grid-label">Settings</span>
                </div>
            </div>


            <!-- Action Button Call to Action Element -->
            <button class="btn-new-tab">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                New Tab
            </button>



        </div>
    </div>
    <div id="main">
        <div class="top-browser-bar">
            <button id="menubtn" class="openbtn" data-state="closed">
                <img id="MenuButtonIcon" src="assets/svg/menu.svg" alt="Menu">
            </button>

            <button id="menubtn" class="backbtn">
                <img id="MenuButtonIcon" src="assets/svg/backarrow.svg" alt="Back">
            </button>

            <button id="menubtn" class="forwardbtn">
                <img id="MenuButtonIcon"    src="assets/svg/frontarrow.svg" alt="Forward">
            </button>

            <button id="menubtn" class="reloadbtn">
                <img id="MenuButtonIcon" src="assets/svg/reload.svg" alt="Reload">
            </button>

            <div class="url-bar-container">
                <!-- SVG Security Padlock Icon Asset -->
                <svg class="url-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                </svg>
                <input class="url-input" type="text" value="antarctic://games" placeholder="Search or enter web address"
                    aria-label="URL Address Bar">
            </div>
        </div>
          <div id="viewport-content"></div>
    </div>
    <div id="access-gate" class="access-gate" role="dialog" aria-modal="true" aria-labelledby="access-gate-title">
        <div class="access-gate-shell">
            <div class="access-gate-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                    <path d="M12 3 19 6v5c0 4.7-2.9 8.1-7 10-4.1-1.9-7-5.3-7-10V6l7-3Z" />
                    <path d="m9 12 2 2 4-4" />
                </svg>
            </div>
            <div class="access-gate-eyebrow">Antarctic Games</div>
            <h1 id="access-gate-title">Before you continue</h1>
            <p class="access-gate-copy">Read the Terms of Service, then confirm to enter Antarctic.</p>
            <div class="access-gate-consent">
                <label class="access-gate-checkbox-pill" for="access-gate-agreement">
                    <input id="access-gate-agreement" type="checkbox" aria-label="Accept the Antarctic Games Terms of Service">
                </label>
                <label class="access-gate-consent-copy" for="access-gate-agreement">
                    I agree to the <a id="access-terms-link" href="terms.html">Antarctic Games Terms of Service</a>.
                </label>
            </div>
            <button id="access-gate-continue" class="access-gate-continue" type="button" disabled>
                Continue
                <span aria-hidden="true">→</span>
            </button>
            <p class="access-gate-hint">Saved on this device.</p>
            <div class="access-gate-footer">✦ Antarctic Games</div>
        </div>
    </div>
    <div id="tos-modal" class="tos-modal" role="dialog" aria-modal="true" aria-labelledby="tos-modal-title" hidden>
        <div class="tos-modal-panel">
            <header class="tos-modal-header">
                <button id="tos-modal-exit" class="tos-modal-exit" type="button">Exit</button>
                <div id="tos-modal-title" class="tos-modal-brand">Antarctic</div>
            </header>
            <div id="tos-modal-content" class="tos-modal-content" aria-live="polite"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
