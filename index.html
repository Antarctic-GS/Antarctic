<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antarctic</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/logo/favicon.png" type="image/png">
</head>
<body>
    <div id="sidebar" class="sidebar">

        <!-- Upper Functional Navigation Context (Tabs Control Block) -->
        <div class="sidebar-top">
            <div class="section-label">Tabs</div>
            <div class="tab-item">
                <div class="tab-favicon">N</div>
                <div class="tab-title">New Tab</div>
            </div>
        </div>

        <!-- Master Application and Utility Deck Controls Area -->
        <div class="sidebar-bottom">

            <!-- High Fidelity Grid Dashboard Layout Ecosystem (Updated to 2x2 Grid) -->
            <div class="apps-grid">
                <!-- Grid Items -->
                <div class="grid-item">
                    <div class="icon-box">

                        <img class="sidebar-button-icon" src="assets/svg/games.svg" alt="Games Icon" />
                    </div>
                    <span class="grid-label">Games</span>
                </div>

                <div class="grid-item">
                    <div class="icon-box">
                        <img class="sidebar-button-icon" src="assets/svg/apps.svg" alt="Apps Icon" />
                    </div>
                    <span class="grid-label">Apps</span>
                </div>

                <div class="grid-item">
                    <div class="icon-box">
                        <img class="sidebar-button-icon" ; src="assets/svg/music.svg" alt="Music Icon" />
                    </div>
                    <span class="grid-label">Music</span>
                </div>

                <div class="grid-item">
                    <div class="icon-box">
                        <img class="sidebar-button-icon" src="assets/svg/settings.svg" alt="Settings Icon" />
                    </div>
                    <span class="grid-label">Settings</span>
                </div>
            </div>


            <!-- Action Button Call to Action Element -->
            <button class="btn-new-tab">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                New Tab
            </button>



        </div>
    </div>
    <div id="main">
        <div class="top-browser-bar">
            <button id="menubtn" class="openbtn" data-state="closed">
                <img id="MenuButtonIcon" src="assets/svg/menu.svg" alt="Menu">
            </button>

            <button id="menubtn" class="backbtn">
                <img id="MenuButtonIcon" src="assets/svg/backarrow.svg" alt="Back">
            </button>

            <button id="menubtn" class="forwardbtn">
                <img id="MenuButtonIcon"    src="assets/svg/frontarrow.svg" alt="Forward">
            </button>

            <button id="menubtn" class="reloadbtn">
                <img id="MenuButtonIcon" src="assets/svg/reload.svg" alt="Reload">
            </button>

            <div class="url-bar-container">
                <!-- SVG Security Padlock Icon Asset -->
                <svg class="url-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                </svg>
                <input class="url-input" type="text" value="antarctic://games" placeholder="Search or enter web address"
                    aria-label="URL Address Bar">
            </div>
        </div>
          <div id="viewport-content"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
