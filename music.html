<style>
  .music-page {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    height: 100%;
    min-height: 100%;
    overflow: hidden;
    color: #e2e8f0;
    font-family: var(--font-primary);
    background:
      radial-gradient(circle at 78% 0%, rgba(124, 58, 237, .18), transparent 28%),
      radial-gradient(circle at 25% 90%, rgba(14, 165, 233, .16), transparent 35%),
      linear-gradient(145deg, #070f22, #050a18 72%, #0b1227);
  }

  .music-topbar,
  .music-brand,
  .music-topbar-actions,
  .music-dock-track,
  .music-dock-actions,
  .music-dock-volume,
  .music-search-bar,
  .music-shelf-heading,
  .music-card-meta {
    display: flex;
    align-items: center;
  }

  .music-topbar {
    justify-content: space-between;
    gap: 18px;
    min-width: 0;
    padding: 14px 24px;
    border-bottom: 1px solid rgba(148, 163, 184, .13);
    background: rgba(7, 15, 34, .74);
    box-shadow: 0 12px 30px rgba(2, 6, 23, .16);
  }
  .music-brand { gap: 11px; }
  .music-brand-mark {
    display: grid;
    width: 34px;
    height: 34px;
    place-items: center;
    border: 1px solid rgba(125, 211, 252, .36);
    border-radius: 10px;
    background: linear-gradient(145deg, rgba(14, 116, 144, .5), rgba(30, 64, 175, .36));
    color: #bae6fd;
    box-shadow: 0 0 22px rgba(56, 189, 248, .16);
  }
  .music-brand-mark svg { width: 18px; height: 18px; }
  .music-brand-copy strong { display: block; color: #f8fafc; font-size: 14px; letter-spacing: .3px; }
  .music-brand-copy span {
    display: block;
    margin-top: 2px;
    color: #7dd3fc;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }
  .music-topbar-actions { gap: 8px; }
  .music-backend {
    padding: 7px 9px;
    border: 1px solid rgba(52, 211, 153, .22);
    border-radius: 999px;
    background: rgba(16, 185, 129, .1);
    color: #a7f3d0;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .4px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .music-icon-button,
  .music-add-button,
  .music-dock-actions button {
    display: inline-grid;
    place-items: center;
    border: 1px solid rgba(125, 211, 252, .22);
    border-radius: 10px;
    background: rgba(14, 116, 144, .2);
    color: #bae6fd;
    font: inherit;
    cursor: pointer;
    transition: background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .music-icon-button { width: 36px; height: 36px; }
  .music-icon-button svg { width: 17px; height: 17px; }
  .music-icon-button:hover,
  .music-add-button:hover,
  .music-dock-actions button:hover {
    border-color: rgba(125, 211, 252, .54);
    background: rgba(14, 116, 144, .36);
    transform: translateY(-1px);
  }

  .music-layout {
    display: grid;
    grid-template-columns: 236px minmax(0, 1fr);
    min-height: 0;
  }
  .music-sidebar {
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 25px 15px 18px;
    border-right: 1px solid rgba(148, 163, 184, .13);
    background: rgba(2, 6, 23, .28);
  }
  .music-sidebar-brand { padding: 0 10px 23px; }
  .music-sidebar-brand strong { display: block; color: #f8fafc; font-size: 24px; letter-spacing: -.7px; }
  .music-sidebar-brand span { display: block; margin-top: 5px; color: #38bdf8; font-size: 9px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; }
  .music-nav { display: grid; gap: 5px; }
  .music-nav-button {
    display: flex;
    align-items: center;
    gap: 11px;
    width: 100%;
    padding: 11px 12px;
    border: 1px solid transparent;
    border-radius: 11px;
    background: transparent;
    color: #94a3b8;
    font: inherit;
    font-size: 12px;
    text-align: left;
    cursor: pointer;
  }
  .music-nav-button:hover,
  .music-nav-button.active {
    border-color: rgba(56, 189, 248, .18);
    background: rgba(56, 189, 248, .12);
    color: #e0f2fe;
  }
  .music-nav-icon { width: 18px; color: #7dd3fc; text-align: center; }
  .music-sidebar-divider { height: 1px; margin: 23px 9px 18px; background: rgba(148, 163, 184, .12); }
  .music-sidebar-queue-heading {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 0 10px 10px;
    color: #cbd5e1;
    font-size: 11px;
    font-weight: 700;
  }
  .music-sidebar-queue-heading span { color: #64748b; font-size: 9px; font-weight: 500; }
  .music-queue-list { display: grid; flex: 1 1 auto; gap: 6px; min-height: 0; overflow: auto; padding: 0 2px; }
  .music-queue-item {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: #94a3b8;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .music-queue-item:hover,
  .music-queue-item.active { border-color: rgba(56, 189, 248, .26); background: rgba(14, 116, 144, .2); color: #e0f2fe; }
  .music-queue-number { display: grid; width: 32px; height: 32px; place-items: center; border: 1px solid rgba(125, 211, 252, .18); border-radius: 8px; color: #7dd3fc; font-size: 10px; }
  .music-queue-copy { min-width: 0; }
  .music-queue-title { display: block; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .music-queue-provider { display: block; margin-top: 3px; color: #64748b; font-size: 9px; }
  .music-queue-remove { border: 0; background: transparent; color: #64748b; font: inherit; font-size: 16px; cursor: pointer; }
  .music-queue-remove:hover { color: #fda4af; }
  .music-empty-queue { padding: 15px 10px; border: 1px dashed rgba(148, 163, 184, .18); border-radius: 10px; color: #64748b; font-size: 10px; line-height: 1.6; text-align: center; }

  .music-main { min-width: 0; min-height: 0; overflow: auto; padding: 28px 32px 42px; scrollbar-width: thin; scrollbar-color: rgba(125, 211, 252, .42) transparent; }
  .music-main-header { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 21px; }
  .music-eyebrow { color: #7dd3fc; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
  .music-main-header h1 { margin: 5px 0 7px; color: #f8fafc; font-size: clamp(28px, 3vw, 40px); letter-spacing: -1.2px; }
  .music-main-header p { margin: 0; color: #94a3b8; font-size: 12px; }
  .music-search-bar { gap: 8px; max-width: 670px; margin-bottom: 28px; }
  .music-add-input { width: 100%; min-width: 0; padding: 12px 14px; border: 1px solid rgba(125, 211, 252, .2); border-radius: 10px; outline: 0; background: rgba(2, 6, 23, .46); color: #e0f2fe; font: inherit; font-size: 12px; }
  .music-add-input::placeholder { color: #64748b; }
  .music-add-button { min-height: 40px; padding: 0 16px; white-space: nowrap; font-size: 11px; font-weight: 700; }
  .music-search-status { min-height: 16px; margin: -19px 0 17px; color: #7dd3fc; font-size: 10px; }
  .music-browse-sections { display: grid; gap: 28px; }
  .music-shelf { min-width: 0; }
  .music-shelf-heading { justify-content: space-between; gap: 15px; margin-bottom: 12px; }
  .music-shelf-heading h2 { margin: 0; color: #f8fafc; font-size: 16px; letter-spacing: -.2px; }
  .music-shelf-heading span { color: #64748b; font-size: 10px; }
  .music-card-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(145px, 176px); gap: 15px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: thin; scrollbar-color: rgba(125, 211, 252, .42) transparent; }
  .music-card,
  .music-search-result { display: block; width: 100%; min-width: 0; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; appearance: none; }
  .music-card-art { position: relative; display: block; width: 100%; aspect-ratio: 1; overflow: hidden; border: 1px solid rgba(125, 211, 252, .16); border-radius: 13px; background: linear-gradient(145deg, #123254, #111827 65%, #1e1b4b); box-shadow: 0 10px 22px rgba(2, 6, 23, .25); transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
  .music-card-art::before { position: absolute; z-index: 1; inset: 50% auto auto 50%; display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid rgba(255, 255, 255, .5); border-radius: 50%; background: rgba(2, 6, 23, .62); color: #f8fafc; content: '▶'; font-size: 13px; opacity: 0; transform: translate(-50%, -50%) scale(.86); transition: opacity .2s ease, transform .2s ease; }
  .music-card-art::after { position: absolute; inset: 0; content: ''; background: linear-gradient(145deg, rgba(56, 189, 248, .14), transparent 55%); pointer-events: none; }
  .music-card-art img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .music-card:hover .music-card-art,
  .music-search-result:hover .music-card-art { border-color: rgba(56, 189, 248, .62); box-shadow: 0 12px 28px rgba(14, 165, 233, .16); transform: translateY(-3px); }
  .music-card:hover .music-card-art::before,
  .music-search-result:hover .music-card-art::before { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .music-card-copy { display: block; min-width: 0; padding: 9px 2px 0; }
  .music-card-title { display: block; overflow: hidden; color: #e2e8f0; font-size: 11px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
  .music-card-subtitle { display: block; overflow: hidden; margin-top: 4px; color: #64748b; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
  .music-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 24px 15px; }
  .music-card-grid[hidden], .music-browse-sections[hidden] { display: none; }
  #music-search-relay-host { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }

  .music-player-dock { position: relative; display: grid; grid-template-columns: minmax(170px, 1.15fr) minmax(260px, 1.6fr) minmax(130px, .8fr) minmax(120px, .7fr); align-items: center; gap: 22px; min-height: 84px; padding: 11px 22px; border-top: 1px solid rgba(125, 211, 252, .2); background: rgba(5, 12, 28, .94); box-shadow: 0 -14px 34px rgba(2, 6, 23, .3); }
  .music-dock-track { min-width: 0; gap: 11px; }
  .music-dock-art { flex: 0 0 auto; width: 48px; height: 48px; border: 1px solid rgba(125, 211, 252, .2); border-radius: 9px; background: linear-gradient(145deg, #164e63, #172554); }
  .music-dock-copy { min-width: 0; }
  .music-dock-copy strong { display: block; overflow: hidden; color: #f8fafc; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
  .music-dock-copy span { display: block; overflow: hidden; margin-top: 4px; color: #64748b; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
  .music-dock-center { min-width: 0; }
  .music-dock-actions { justify-content: center; gap: 9px; margin-bottom: 8px; }
  .music-dock-actions button { width: 30px; height: 28px; font-size: 13px; }
  .music-dock-actions .music-play { width: 37px; background: linear-gradient(145deg, #0ea5e9, #2563a6); color: #f8fafc; font-size: 14px; }
  .music-range-row { display: flex; align-items: center; gap: 8px; }
  .music-time { min-width: 31px; color: #64748b; font-size: 9px; text-align: center; }
  .music-progress, .music-volume { width: 100%; accent-color: #38bdf8; cursor: pointer; }
  .music-dock-volume { gap: 8px; color: #94a3b8; font-size: 12px; }
  .music-volume { width: 100px; }
  .music-player-status { color: #64748b; font-size: 10px; line-height: 1.35; }
  .music-media-host { position: absolute; top: 7px; right: 12px; width: 180px; height: 100px; overflow: hidden; opacity: .02; pointer-events: none; }
  .music-media-host iframe { display: block; width: 100%; height: 100%; border: 0; }

  .music-main::-webkit-scrollbar,
  .music-card-row::-webkit-scrollbar,
  .music-queue-list::-webkit-scrollbar { width: 8px; height: 8px; }
  .music-main::-webkit-scrollbar-track,
  .music-card-row::-webkit-scrollbar-track,
  .music-queue-list::-webkit-scrollbar-track { background: transparent; }
  .music-main::-webkit-scrollbar-thumb,
  .music-card-row::-webkit-scrollbar-thumb,
  .music-queue-list::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 999px; background: rgba(125, 211, 252, .34); background-clip: padding-box; }
  .music-main::-webkit-scrollbar-thumb:hover,
  .music-card-row::-webkit-scrollbar-thumb:hover,
  .music-queue-list::-webkit-scrollbar-thumb:hover { background: rgba(125, 211, 252, .58); background-clip: padding-box; }

  .music-icon-button:focus-visible,
  .music-nav-button:focus-visible,
  .music-add-button:focus-visible,
  .music-add-input:focus-visible,
  .music-card:focus-visible,
  .music-search-result:focus-visible,
  .music-dock-actions button:focus-visible,
  .music-progress:focus-visible,
  .music-volume:focus-visible,
  .music-queue-item:focus-visible { outline: 2px solid #7dd3fc; outline-offset: 3px; }

  @media (max-width: 900px) {
    .music-layout { grid-template-columns: 190px minmax(0, 1fr); }
    .music-main { padding-inline: 22px; }
    .music-player-dock { grid-template-columns: minmax(150px, 1fr) minmax(230px, 1.3fr) minmax(90px, .6fr); gap: 12px; }
    .music-player-status { display: none; }
  }
  @media (max-width: 680px) {
    .music-topbar { padding: 12px 15px; }
    .music-brand-copy span, .music-backend { display: none; }
    .music-layout { display: block; overflow: auto; }
    .music-sidebar { display: block; min-height: auto; padding: 15px; border-right: 0; border-bottom: 1px solid rgba(148, 163, 184, .13); }
    .music-sidebar-brand { display: none; }
    .music-nav { grid-template-columns: repeat(3, 1fr); }
    .music-sidebar-divider, .music-sidebar-queue-heading { display: none; }
    .music-queue-list { display: none; }
    .music-main { overflow: visible; padding: 22px 15px 26px; }
    .music-search-bar { align-items: stretch; flex-direction: column; }
    .music-add-button { min-height: 38px; }
    .music-player-dock { grid-template-columns: 1fr auto; gap: 10px; padding: 10px 13px; }
    .music-dock-center { grid-column: 1 / -1; grid-row: 2; }
    .music-dock-volume { display: none; }
    .music-media-host { width: 1px; height: 1px; }
  }
</style>

<section class="music-page" aria-label="Antarctic Music">
  <header class="music-topbar">
    <div class="music-brand">
      <div class="music-brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M9 18V6l10-2v12" />
          <circle cx="6" cy="18" r="3" />
          <circle cx="16" cy="16" r="3" />
        </svg>
      </div>
      <div class="music-brand-copy">
        <strong>Antarctic Player</strong>
        <span>Browse the relay library</span>
      </div>
    </div>
    <div class="music-topbar-actions">
      <span id="music-backend-label" class="music-backend">Relay</span>
      <button id="music-refresh" class="music-icon-button" type="button" aria-label="Reload current track">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8 8 0 0 0-14.9-3.9L3 10" /><path d="M3 5v5h5" /><path d="M4 13a8 8 0 0 0 14.9 3.9L21 14" /><path d="M21 19v-5h-5" /></svg>
      </button>
      <button id="music-fullscreen" class="music-icon-button" type="button" aria-label="Enter fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5" /></svg>
      </button>
    </div>
  </header>

  <div class="music-layout">
    <aside class="music-sidebar" aria-label="Music navigation">
      <div class="music-sidebar-brand"><strong>Music</strong><span>Antarctic collection</span></div>
      <nav class="music-nav" aria-label="Music views">
        <button class="music-nav-button active" type="button" data-music-view="browse"><span class="music-nav-icon">⌂</span>Browse</button>
        <button class="music-nav-button" type="button" data-music-view="search"><span class="music-nav-icon">⌕</span>Search</button>
        <button class="music-nav-button" type="button" data-music-view="queue"><span class="music-nav-icon">≡</span>Your queue</button>
      </nav>
      <div class="music-sidebar-divider"></div>
      <div class="music-sidebar-queue-heading"><span>Current queue</span><span id="music-queue-count">0 tracks</span></div>
      <div id="music-queue-list" class="music-queue-list"></div>
    </aside>

    <main class="music-main">
      <div class="music-main-header">
        <div>
          <span class="music-eyebrow">Antarctic Music</span>
          <h1>Browse</h1>
          <p id="music-browse-status">Curated shelves, powered by the relay.</p>
        </div>
      </div>
      <form id="music-add-form" class="music-search-bar">
        <input id="music-add-input" class="music-add-input" type="search" placeholder="Search songs or artists" aria-label="Search songs or artists" required>
        <button class="music-add-button" type="submit">Search</button>
      </form>
      <div id="music-search-status" class="music-search-status" role="status" aria-live="polite"></div>
      <div id="music-search-results" class="music-card-grid" aria-label="Search results" hidden></div>
      <div id="music-browse-sections" class="music-browse-sections" aria-label="Music shelves"></div>
      <div id="music-search-relay-host" aria-hidden="true"></div>
    </main>
  </div>

  <footer class="music-player-dock" aria-label="Custom player controls">
    <div id="music-relay-host" class="music-media-host"></div>
    <div class="music-dock-track">
      <div class="music-dock-art" aria-hidden="true"></div>
      <div class="music-dock-copy">
        <strong id="music-now-playing-title">Nothing playing</strong>
        <span id="music-now-playing-source">Choose a song to begin</span>
      </div>
    </div>
    <div class="music-dock-center">
      <div class="music-dock-actions">
        <button id="music-previous" type="button" aria-label="Previous track">‹</button>
        <button id="music-play" class="music-play" type="button" aria-label="Play">▶</button>
        <button id="music-next" type="button" aria-label="Next track">›</button>
      </div>
      <div class="music-range-row">
        <span id="music-current-time" class="music-time">0:00</span>
        <input id="music-progress" class="music-progress" type="range" min="0" max="0" step="0.1" value="0" aria-label="Track progress">
        <span id="music-duration" class="music-time">0:00</span>
      </div>
    </div>
    <label class="music-dock-volume" for="music-volume"><span aria-hidden="true">🔊</span><input id="music-volume" class="music-volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume"></label>
    <span id="music-player-status" class="music-player-status" role="status" aria-live="polite">Waiting for a track</span>
  </footer>
</section>
