<style>
  .apps-page {
    min-height: 100%;
    padding: clamp(24px, 5vw, 58px);
    color: var(--text-main);
    font-family: var(--font-primary);
  }

  .apps-hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    max-width: 1120px;
    margin: 0 auto 28px;
  }

  .apps-eyebrow {
    margin-bottom: 8px;
    color: #7dd3fc;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .apps-title {
    color: #f8fafc;
    font-size: clamp(28px, 4vw, 44px);
    line-height: 1;
    letter-spacing: -1.5px;
  }

  .apps-subtitle {
    max-width: 430px;
    margin-top: 12px;
    color: #94a3b8;
    font-size: 13px;
    line-height: 1.6;
  }

  .apps-search {
    display: flex;
    align-items: center;
    width: min(100%, 310px);
    height: 42px;
    padding: 0 14px;
    border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 13px;
    background: rgba(15, 23, 42, .45);
    box-shadow: inset 0 1px rgba(255, 255, 255, .06);
    backdrop-filter: blur(12px);
  }

  .apps-search:focus-within {
    border-color: rgba(125, 211, 252, .55);
    box-shadow: 0 0 24px rgba(56, 189, 248, .12), inset 0 1px rgba(255, 255, 255, .1);
  }

  .apps-search-icon {
    width: 16px;
    height: 16px;
    margin-right: 10px;
    color: #64748b;
  }

  .apps-search input {
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: #e2e8f0;
    font: inherit;
    font-size: 12px;
  }

  .apps-search input::placeholder { color: #64748b; }

  .apps-categories {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-width: 1120px;
    margin: 0 auto 28px;
  }

  .apps-category {
    padding: 7px 14px;
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 999px;
    background: rgba(255, 255, 255, .035);
    color: #94a3b8;
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    transition: background .2s ease, border-color .2s ease, color .2s ease, transform .2s ease;
  }

  .apps-category:hover { color: #f8fafc; transform: translateY(-1px); }
  .apps-category.active { border-color: rgba(125, 211, 252, .45); background: rgba(56, 189, 248, .14); color: #e0f2fe; }

  .apps-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
    max-width: 1120px;
    margin: 0 auto;
  }

  .app-arcade-card {
    position: relative;
    min-height: 0;
    aspect-ratio: 16 / 9;
    background-size: cover;
    background-position: center;
    background-blend-mode: multiply;
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 12px;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .4);
    transition: all .3s cubic-bezier(.4, 0, .2, 1);
  }

  .app-arcade-card:hover {
    border-color: rgba(96, 165, 250, .5);
    box-shadow: 0 0 25px rgba(37, 99, 235, .25), 0 8px 20px rgba(0, 0, 0, .6);
    transform: translateY(-4px) scale(1.02);
  }

  .app-arcade-card::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: rgba(3, 7, 18, .12);
  }

  .app-arcade-card .card-details-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    height: 60%;
    padding: 12px;
    background: linear-gradient(to top, rgba(3, 7, 18, .95) 0%, rgba(3, 7, 18, .4) 60%, transparent 100%);
  }

  .app-arcade-card .card-tag {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 3;
    display: flex;
    align-items: center;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    background: rgba(8, 15, 31, .62);
    color: #bae6fd;
    border: 1px solid rgba(186, 230, 253, .24);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  .app-arcade-card .card-title {
    color: #f1f5f9;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .2px;
    line-height: 1.3;
    text-shadow: 0 1px 4px rgba(0, 0, 0, .75);
  }

  .apps-empty { grid-column: 1 / -1; padding: 54px 20px; color: #94a3b8; font-size: 13px; text-align: center; }
  .apps-error { color: #fca5a5; }

  @media (max-width: 680px) {
    .apps-page { padding: 24px 18px; }
    .apps-hero { display: block; }
    .apps-search { margin-top: 22px; width: 100%; }
  }
</style>

<section class="apps-page" aria-label="Apps directory">
  <div class="apps-hero">
    <div>
      <div class="apps-eyebrow">Antarctic directory</div>
      <h1 class="apps-title">Apps</h1>
      <p class="apps-subtitle">Your favorite places to play, watch, create, and hang out—right from the Antarctic launchpad.</p>
    </div>
    <label class="apps-search">
      <svg class="apps-search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
      </svg>
      <input id="appsSearch" type="search" placeholder="Search apps..." autocomplete="off">
    </label>
  </div>

  <nav id="appsCategories" class="apps-categories" aria-label="App categories">
    <button type="button" class="apps-category active" data-app-category="all">All apps</button>
    <button type="button" class="apps-category" data-app-category="gaming">Gaming</button>
    <button type="button" class="apps-category" data-app-category="social">Social</button>
    <button type="button" class="apps-category" data-app-category="media">Media</button>
    <button type="button" class="apps-category" data-app-category="productivity">Productivity</button>
  </nav>

  <div id="appsContainer" class="apps-card-grid">
    <div class="apps-empty">Loading app directory...</div>
  </div>
</section>
