<style>
  .apps-page {
    min-height: 100%;
    padding: clamp(24px, 5vw, 58px);
    color: var(--text-main);
    font-family: var(--font-primary);
  }

  .apps-hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    max-width: 1120px;
    margin: 0 auto 28px;
  }

  .apps-eyebrow {
    margin-bottom: 8px;
    color: #7dd3fc;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .apps-title {
    color: #f8fafc;
    font-size: clamp(28px, 4vw, 44px);
    line-height: 1;
    letter-spacing: -1.5px;
  }

  .apps-subtitle {
    max-width: 430px;
    margin-top: 12px;
    color: #94a3b8;
    font-size: 13px;
    line-height: 1.6;
  }

  .apps-search {
    display: flex;
    align-items: center;
    width: min(100%, 310px);
    height: 42px;
    padding: 0 14px;
    border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 13px;
    background: rgba(15, 23, 42, .45);
    box-shadow: inset 0 1px rgba(255, 255, 255, .06);
    backdrop-filter: blur(12px);
  }

  .apps-search:focus-within {
    border-color: rgba(125, 211, 252, .55);
    box-shadow: 0 0 24px rgba(56, 189, 248, .12), inset 0 1px rgba(255, 255, 255, .1);
  }

  .apps-search-icon {
    width: 16px;
    height: 16px;
    margin-right: 10px;
    color: #64748b;
  }

  .apps-search input {
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: #e2e8f0;
    font: inherit;
    font-size: 12px;
  }

  .apps-search input::placeholder { color: #64748b; }

  .apps-categories {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-width: 1120px;
    margin: 0 auto 28px;
  }

  .apps-category {
    padding: 7px 14px;
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 999px;
    background: rgba(255, 255, 255, .035);
    color: #94a3b8;
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    transition: background .2s ease, border-color .2s ease, color .2s ease, transform .2s ease;
  }

  .apps-category:hover { color: #f8fafc; transform: translateY(-1px); }
  .apps-category.active { border-color: rgba(125, 211, 252, .45); background: rgba(56, 189, 248, .14); color: #e0f2fe; }

  .apps-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
    gap: 14px;
    max-width: 1120px;
    margin: 0 auto;
  }

  .app-card {
    position: relative;
    min-height: 178px;
    padding: 18px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 17px;
    background: linear-gradient(145deg, rgba(30, 41, 59, .68), rgba(15, 23, 42, .48));
    box-shadow: 0 12px 30px rgba(0, 0, 0, .2), inset 0 1px rgba(255, 255, 255, .07);
    color: inherit;
    cursor: pointer;
    font: inherit;
    text-align: left;
    transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
  }

  .app-card::after {
    position: absolute;
    right: -35px;
    bottom: -55px;
    width: 145px;
    height: 145px;
    border-radius: 50%;
    background: var(--app-accent);
    content: '';
    opacity: .12;
    filter: blur(22px);
    transition: opacity .22s ease, transform .22s ease;
  }

  .app-card:hover {
    border-color: color-mix(in srgb, var(--app-accent) 58%, white 12%);
    box-shadow: 0 18px 38px rgba(0, 0, 0, .3), 0 0 26px color-mix(in srgb, var(--app-accent) 18%, transparent);
    transform: translateY(-4px);
  }

  .app-card:hover::after { opacity: .24; transform: scale(1.2); }

  .app-card-topline { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; }

  .app-icon {
    display: grid;
    width: 44px;
    height: 44px;
    place-items: center;
    border: 1px solid color-mix(in srgb, var(--app-accent) 58%, white 12%);
    border-radius: 13px;
    background: linear-gradient(145deg, color-mix(in srgb, var(--app-accent) 52%, white 8%), color-mix(in srgb, var(--app-accent) 28%, #0f172a 72%));
    box-shadow: 0 8px 18px color-mix(in srgb, var(--app-accent) 20%, transparent);
    color: #fff;
    font-family: var(--font-primary);
    font-size: 16px;
    font-weight: 800;
  }

  .app-arrow { color: #64748b; font-size: 20px; transition: color .2s ease, transform .2s ease; }
  .app-card:hover .app-arrow { color: #e0f2fe; transform: translate(2px, -2px); }
  .app-card-category { position: relative; z-index: 1; display: block; margin-top: 18px; color: var(--app-accent); font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
  .app-card-name { position: relative; z-index: 1; display: block; margin-top: 5px; color: #f8fafc; font-size: 16px; font-weight: 650; }
  .app-card-description { position: relative; z-index: 1; display: block; margin-top: 8px; color: #94a3b8; font-size: 11px; line-height: 1.5; }

  .apps-empty { grid-column: 1 / -1; padding: 54px 20px; color: #94a3b8; font-size: 13px; text-align: center; }
  .apps-error { color: #fca5a5; }

  @media (max-width: 680px) {
    .apps-page { padding: 24px 18px; }
    .apps-hero { display: block; }
    .apps-search { margin-top: 22px; width: 100%; }
  }
</style>

<section class="apps-page" aria-label="Apps directory">
  <div class="apps-hero">
    <div>
      <div class="apps-eyebrow">Antarctic directory</div>
      <h1 class="apps-title">Apps</h1>
      <p class="apps-subtitle">Your favorite places to play, watch, create, and hang out—right from the Antarctic launchpad.</p>
    </div>
    <label class="apps-search">
      <svg class="apps-search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
      </svg>
      <input id="appsSearch" type="search" placeholder="Search apps..." autocomplete="off">
    </label>
  </div>

  <nav id="appsCategories" class="apps-categories" aria-label="App categories">
    <button type="button" class="apps-category active" data-app-category="all">All apps</button>
    <button type="button" class="apps-category" data-app-category="gaming">Gaming</button>
    <button type="button" class="apps-category" data-app-category="social">Social</button>
    <button type="button" class="apps-category" data-app-category="media">Media</button>
    <button type="button" class="apps-category" data-app-category="productivity">Productivity</button>
  </nav>

  <div id="appsContainer" class="apps-card-grid">
    <div class="apps-empty">Loading app directory...</div>
  </div>
</section>
