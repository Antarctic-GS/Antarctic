<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antarctic Games - Portal</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Viewport Core Layout Setup */
    .viewport-padding {
      padding: 24px;
      font-family: 'Saira', sans-serif;
    }
    
    .games-header-section {
      margin-bottom: 20px;
    }

    /* Premium Glassmorphic Search Bar Grid Engine - Centered Layout Configuration */

    .search-row {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-bottom: 16px;
    }

    .search-container {
      flex: 1;
      display: flex;
      align-items: center;
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 0 14px;
      height: 38px;
      max-width: 600px;
      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);
      transition: border-color 0.2s ease, background-color 0.2s ease;
      box-sizing: border-box;
    }
    
    .search-container:focus-within {
      border-color: rgba(96, 165, 250, 0.5);
      background: rgba(30, 41, 59, 0.6);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.15);
    }
    
    .search-icon {
      width: 16px;
      height: 16px;
      color: #64748b;
      margin-right: 10px;
      flex-shrink: 0;
    }
    

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 0;
    }
    
    .search-input::placeholder {
      color: #475569;
    }

    /* Horizontal Category Selection Pills System */
    .categories-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
      position: relative;
      z-index: 5;
    }

    .category-pill {
      appearance: none;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #94a3b8;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .category-pill:hover {

      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      color: #f8fafc;
    }

    .category-pill.active {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.3) 0%, rgba(30, 58, 138, 0.4) 100%);
      border-color: rgba(96, 165, 250, 0.4);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .filters-control {
      position: relative;
    }

    .filters-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filters-count {
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: rgba(96, 165, 250, 0.22);
      color: #bfdbfe;
      font-size: 10px;
      line-height: 16px;
    }

    .filters-popover {
      display: none;
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 220px;
      padding: 14px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.88);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(18px) saturate(135%);
      -webkit-backdrop-filter: blur(18px) saturate(135%);
    }

    .filters-control.open .filters-popover {
      display: grid;
      gap: 9px;
    }

    .filters-popover-title {
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
      font-size: 12px;
      cursor: pointer;
    }

    .filter-option input {
      accent-color: #60a5fa;
    }

    .clear-filters {
      margin-top: 4px;
      padding: 6px 0 0;
      border: 0;
      border-top: 1px solid rgba(148, 163, 184, 0.14);
      background: transparent;
      color: #94a3b8;
      font: inherit;
      font-size: 11px;
      text-align: left;
      cursor: pointer;
    }

    .clear-filters:hover {
      color: #f8fafc;
    }

    /* Shelved Shelf Content Sections */
    .shelf-container {
      margin-bottom: 32px;
    }

    .shelf-title {
      font-size: 14px;

      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
      margin-bottom: 14px;
    }

    /* High Fidelity Layout Image Grid Deck Layout */
    .arcade-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }
    
    .arcade-card {
      position: relative;
      aspect-ratio: 16 / 10;
      background-color: rgba(15, 23, 42, 0.6);
      background-size: cover;
      background-position: center;

      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .arcade-card:hover {
      border-color: rgba(96, 165, 250, 0.5);
      box-shadow: 0 0 25px rgba(37, 99, 235, 0.25), 0 8px 20px rgba(0, 0, 0, 0.6);
      transform: translateY(-4px) scale(1.02);
    }
    
    /* Top Accent Status Flag Tags */
    .card-tag {
      position: absolute;
      top: 8px;
      left: 8px;

      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 3px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 2;
    }

    .card-tag.top-rated {
      background: rgba(234, 179, 8, 0.25);
      color: #fde047;
      border: 1px solid rgba(234, 179, 8, 0.3);
    }


    .card-tag.editor-pick {
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* Bottom Linear Vignette Overlay Layout */
    .card-details-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
      background: linear-gradient(to top, rgba(3, 7, 18, 0.95) 0%, rgba(3, 7, 18, 0.4) 60%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 60%;
      z-index: 1;

    }
    
    .card-title {
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      line-height: 1.3;
    }

    /* Status Message Styling */
    .status-msg {
      color: var(--text-muted);
      font-size: 14px;
      font-style: italic;
      text-align: center;
      padding: 40px 0;
      width: 100%;
    }

  </style>
</head>
<body>

  <div class="viewport-padding">
    
    <!-- Premium Filter Input Bar Section -->
    <div class="search-row">
      <div class="search-container">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" id="portalSearch" class="search-input" placeholder="Search games...">
      </div>
    </div>

    <!-- Symmetrical Multi-Category Link Pills Row Navigation Menu -->
    <div class="categories-bar">
      <button type="button" class="category-pill active" data-category="all">All</button>

      <button type="button" class="category-pill" data-category="action">Action</button>
      <button type="button" class="category-pill" data-category="driving">Driving</button>
      <button type="button" class="category-pill" data-category="strategy">Strategy</button>
      <button type="button" class="category-pill" data-category="sports">Sports</button>
      <button type="button" class="category-pill" data-category="shooting">Shooting</button>
      <button type="button" class="category-pill" data-category="2player">2 Player</button>

      <div class="filters-control" id="filtersControl">
        <button type="button" class="category-pill filters-button" id="filtersButton" aria-expanded="false">
          Filters <span class="filters-count" id="filtersCount" hidden>0</span>
        </button>
        <div class="filters-popover" id="filtersPopover" aria-label="More game filters">
          <div class="filters-popover-title">More tags</div>
          <label class="filter-option"><input type="checkbox" value="arcade"> Arcade</label>
          <label class="filter-option"><input type="checkbox" value="casual"> Casual</label>
          <label class="filter-option"><input type="checkbox" value="multiplayer"> Multiplayer</label>
          <label class="filter-option"><input type="checkbox" value="physics"> Physics</label>
          <label class="filter-option"><input type="checkbox" value="platformer"> Platformer</label>
          <label class="filter-option"><input type="checkbox" value="sandbox"> Sandbox</label>
          <button type="button" class="clear-filters" id="clearFilters">Clear filters</button>
        </div>
      </div>
    </div>

    <!-- Target Mount Anchor for Dynamic App Shelves Component Injection -->
    <div id="shelvesContainer">
      <div class="status-msg">Loading simulation library database...</div>
    </div>

  </div>
  <script src="script.js"></script>

</body>
</html>
