<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antarctic Relay</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0f172a; color: #e2e8f0; }
    main { display: flex; flex-direction: column; min-height: 100vh; padding: 1rem; gap: .75rem; }
    #relay-status { color: #94a3b8; font-size: .85rem; min-height: 1.25rem; }
    #relay-status[data-state="error"] { color: #fca5a5; }
    iframe { flex: 1; width: 100%; min-height: 0; border: 0; border-radius: .5rem; background: white; }
    body.embed main { display: block; padding: 0; }
    body.embed #relay-status { display: none; }
    body.embed iframe { display: block; width: 100vw; height: 100vh; border-radius: 0; }
  </style>
</head>
  <body>
  <main>
    <div id="relay-status" role="status" aria-live="polite">Starting Scramjet…</div>
    <iframe id="relay-frame" title="Scramjet relay"></iframe>
  </main>

  <script src="./package/dist/scramjet_bundled.js"></script>
  <script src="./package/dist/controller.api.js"></script>
  <script src="./package/dist/epoxy-transport.js"></script>
  <script src="./app.js"></script>
</body>
</html>
